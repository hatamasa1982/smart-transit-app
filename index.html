<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマート乗換コンシェルジュ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF8F5;
      --text-color: #2A2A2A;
      --primary-color: #F4A261;
      --primary-hover: #E76F51;
      --card-bg: #FFFFFF;
      --border-color: #E0DCD3;
      --yahoo-color: #FF0033;
      --jorudan-color: #E85217;
      --google-color: #4285F4;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 5px;
      color: var(--text-color);
    }
    
    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin: 0;
    }

    input[type="text"], input[type="password"], input[type="date"], input[type="time"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      box-sizing: border-box;
      background-color: #FAFAFA;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #FFF;
    }

    textarea {
      resize: vertical;
      min-height: 76px;
    }

    /* 音声入力・クリアボタンのツールバー */
    .input-actions {
      display: flex;
      gap: 6px;
    }

    .btn-mini {
      background-color: #F3EFEA;
      color: #555;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-mini:hover {
      background-color: #E6E0D6;
    }

    .btn-mini.listening {
      background-color: #FEE2E2;
      color: #DC2626;
      border-color: #F87171;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* クイック入力タグ（よく使う駅・バス停） */
    .quick-section {
      margin-bottom: 16px;
    }

    .quick-title {
      font-size: 0.78rem;
      color: #777;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background-color: #FFF8F1;
      color: #9A4B1A;
      border: 1px solid #F3D5B5;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s, transform 0.1s;
    }

    .chip:hover {
      background-color: #FDEBD0;
    }

    .chip:active {
      transform: scale(0.96);
    }

    /* 最近の検索履歴 */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #F8F7F4;
      border: 1px solid #EAE6DF;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.82rem;
      color: #444;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .history-item:hover {
      background-color: #EFECE6;
    }

    .history-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-del {
      color: #AAA;
      font-size: 0.9rem;
      padding: 0 4px;
      margin-left: 8px;
      cursor: pointer;
    }

    .history-del:hover {
      color: #E76F51;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s, transform 0.1s;
      box-sizing: border-box;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-yahoo {
      background-color: white;
      color: var(--yahoo-color);
      border: 2px solid var(--yahoo-color);
      margin-bottom: 10px;
    }

    .btn-jorudan {
      background-color: white;
      color: var(--jorudan-color);
      border: 2px solid var(--jorudan-color);
      margin-bottom: 10px;
    }

    .btn-google {
      background-color: white;
      color: var(--google-color);
      border: 2px solid var(--google-color);
    }

    #main-screen, #api-screen, #result-screen {
      display: none;
    }

    .active {
      display: block !important;
    }

    .settings-link {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: 20px;
      text-decoration: underline;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      display: none;
      margin: 20px 0;
      color: var(--primary-color);
      font-weight: 500;
    }
    
    .spinner {
      border: 3px solid rgba(244, 162, 97, 0.3);
      border-radius: 50%;
      border-top: 3px solid var(--primary-color);
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 結果画面の編集・微調整パネル */
    .result-card {
      background-color: #F9F8F6;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #E6E2D8;
      margin-bottom: 20px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #666;
    }

    .route-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .route-inputs {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .route-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .route-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #555;
      width: 36px;
      flex-shrink: 0;
    }

    .btn-swap {
      background-color: #FFF;
      color: var(--primary-hover);
      border: 1px solid #E0DCD3;
      border-radius: 8px;
      padding: 10px 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-swap:hover {
      background-color: #FFF8F1;
      border-color: var(--primary-color);
    }

    .btn-swap:active {
      transform: scale(0.95);
    }

    .datetime-row {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.9fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .time-adjust-row {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .tag-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .tag-dep {
      background-color: #E0F2FE;
      color: #0369A1;
    }
    .tag-arr {
      background-color: #FEF3C7;
      color: #B45309;
    }
    
    .btn-back {
      background-color: #EEE;
      color: #555;
      margin-top: 20px;
    }

    .error-box {
      display: none;
      background-color: #FEE2E2;
      color: #991B1B;
      border: 1px solid #F87171;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 15px;
      word-break: break-all;
    }

    .area-badge {
      font-size: 0.75rem;
      color: #666;
      background: #EAE6DF;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
    }

    .shortcut-hint {
      text-align: right;
      font-size: 0.72rem;
      color: #999;
      margin-top: 4px;
    }

    .app-footer {
      text-align: center;
      margin-top: 25px;
      font-size: 0.75rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>スマート乗換コンシェルジュ</h1>
      <div class="subtitle">自然な言葉で、サッと経路検索。</div>

      <!-- 設定画面 -->
      <div id="api-screen">
        <div class="form-group">
          <label for="api-key" style="margin-bottom: 8px;">Gemini API キー</label>
          <input type="password" id="api-key" placeholder="AIの利用に必要なキーを入力">
        </div>

        <div class="form-group">
          <label for="home-area" style="margin-bottom: 8px;">よく使うホームエリア（同名駅の優先地域）</label>
          <input type="text" id="home-area" value="北海道・札幌" placeholder="例：北海道・札幌、東京都内など">
          <p style="font-size: 0.8rem; color: #777; margin-top: 6px;">
            ※「学園前」「白石」などの全国同名駅がある場合、このエリアの駅が最優先されます。
          </p>
        </div>

        <button class="btn btn-primary" onclick="saveSettings()">設定を保存して使う</button>
      </div>

      <!-- メイン画面（入力） -->
      <div id="main-screen">
        <div class="form-group">
          <div class="label-row">
            <label for="prompt">
              どこへ行きますか？
              <span id="current-home-badge" class="area-badge"></span>
            </label>
            <div class="input-actions">
              <button type="button" class="btn-mini" id="btn-voice" onclick="toggleVoiceInput()" title="音声で入力">🎤 音声入力</button>
              <button type="button" class="btn-mini" onclick="clearPrompt()" title="入力を消去">✕ クリア</button>
            </div>
          </div>
          <textarea id="prompt" placeholder="例：月寒中央から学園前まで&#10;（下のタグを2回タップすると「〇〇から△△まで」と入ります）"></textarea>
          <div class="shortcut-hint">※ Ctrl + Enter でも検索できます</div>
        </div>

        <!-- よく使う駅・バス停タグ -->
        <div class="quick-section">
          <div class="quick-title">
            <span>📍 よく使う駅・バス停（タップで入力）</span>
          </div>
          <div class="chip-list" id="quick-stations"></div>
        </div>

        <button class="btn btn-primary" onclick="analyzeTransit()">経路を検索する</button>
        
        <div id="loading" class="loading">
          <div class="spinner"></div>
          AIが日時と場所を解析中...
        </div>

        <div id="error-box" class="error-box"></div>

        <!-- 最近の検索履歴 -->
        <div class="quick-section" id="history-section" style="margin-top: 20px; display: none;">
          <div class="quick-title">
            <span>🕒 最近の検索履歴</span>
          </div>
          <div class="history-list" id="history-list"></div>
        </div>

        <a class="settings-link" onclick="showScreen('api-screen')">設定（APIキー・ホームエリア）を変更</a>
      </div>

      <!-- 結果画面（その場で微調整＆往復入れ替え対応） -->
      <div id="result-screen">
        <div class="result-card">
          <div class="result-header">
            <span class="result-title">✨ 解析結果（その場で微調整できます）</span>
            <span id="result-type-badge" class="tag-badge tag-dep">出発指定</span>
          </div>

          <div class="route-box">
            <div class="route-inputs">
              <div class="route-row">
                <span class="route-label">出発</span>
                <input type="text" id="edit-from" oninput="syncFromEdit()" placeholder="出発駅・バス停">
              </div>
              <div class="route-row">
                <span class="route-label">到着</span>
                <input type="text" id="edit-to" oninput="syncFromEdit()" placeholder="到着駅・バス停">
              </div>
            </div>
            <button type="button" class="btn-swap" onclick="swapRoute()" title="出発と到着を入れ替える（帰りのルート）">
              ⇅<br><span style="font-size: 0.7rem;">入替</span>
            </button>
          </div>

          <div class="datetime-row">
            <input type="date" id="edit-date" onchange="syncFromEdit()">
            <input type="time" id="edit-time" onchange="syncFromEdit()">
            <select id="edit-type" onchange="syncFromEdit()">
              <option value="departure">出発指定</option>
              <option value="arrival">到着指定</option>
            </select>
          </div>

          <div class="time-adjust-row">
            <button type="button" class="btn-mini" onclick="adjustMinutes(-15)">-15分</button>
            <button type="button" class="btn-mini" onclick="adjustMinutes(15)">+15分</button>
            <button type="button" class="btn-mini" onclick="setNowTime()">現在時刻</button>
          </div>
        </div>
        
        <button class="btn btn-jorudan" id="btn-jorudan" onclick="openJorudan()">🚆 ジョルダン乗換案内で見る</button>
        <button class="btn btn-yahoo" id="btn-yahoo" onclick="openYahoo()">🚃 Yahoo!乗換案内で見る</button>
        <button class="btn btn-google" id="btn-google" onclick="openGoogleMaps()">🗺️ Googleマップで見る</button>
        
        <button class="btn btn-back" onclick="showScreen('main-screen')">戻る</button>
      </div>

      <div class="app-footer">
        v2.0.0 (2026/10/29 更新)
      </div>

    </div>
  </div>

  <script>
    // ==========================================
    // 0. よく使う駅・バス停の定義
    // ==========================================
    const FAVORITE_PLACES = [
      { label: '🚌 月寒西2条9丁目', value: '月寒西2条9丁目' },
      { label: '🚇 月寒中央', value: '月寒中央' },
      { label: '🚉 札幌', value: '札幌' },
      { label: '🚇 学園前（札幌）', value: '学園前(北海道)' },
      { label: '🚉 帯広', value: '帯広' },
      { label: '🚉 旭川', value: '旭川' },
      { label: '✈️🚌 月寒中央通11丁目（空港バス）', value: '月寒中央通11丁目' },
      { label: '✈️🚌 月寒中央通10丁目（空港バス）', value: '月寒中央通10丁目' }
    ];

    // ==========================================
    // 1. 画面切り替え・エラー表示の制御
    // ==========================================
    function showScreen(screenId) {
      document.getElementById('api-screen').classList.remove('active');
      document.getElementById('main-screen').classList.remove('active');
      document.getElementById('result-screen').classList.remove('active');
      document.getElementById(screenId).classList.add('active');
      hideError();
    }

    function showError(msg) {
      const err = document.getElementById('error-box');
      err.style.display = 'block';
      err.innerHTML = msg;
    }

    function hideError() {
      const err = document.getElementById('error-box');
      err.style.display = 'none';
      err.innerHTML = '';
    }

    function updateBadge() {
      const homeArea = localStorage.getItem('home_area') || '北海道・札幌';
      const badge = document.getElementById('current-home-badge');
      if (badge) {
        badge.innerText = `拠点: ${homeArea}`;
      }
    }

    // ==========================================
    // 2. 初期読み込み・設定保存・入力サポート
    // ==========================================
    window.onload = () => {
      const apiKey = localStorage.getItem('gemini_api_key');
      const homeArea = localStorage.getItem('home_area') || '北海道・札幌';
      document.getElementById('home-area').value = homeArea;

      renderQuickStations();
      renderHistory();

      // Ctrl + Enter (または Cmd + Enter) で即検索
      const promptEl = document.getElementById('prompt');
      promptEl.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          analyzeTransit();
        }
      });

      if (apiKey) {
        document.getElementById('api-key').value = apiKey;
        updateBadge();
        showScreen('main-screen');
      } else {
        showScreen('api-screen');
      }
    };

    function saveSettings() {
      const key = document.getElementById('api-key').value.trim();
      const area = document.getElementById('home-area').value.trim() || '北海道・札幌';
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        localStorage.setItem('home_area', area);
        updateBadge();
        showScreen('main-screen');
      } else {
        alert('APIキーを入力してください。');
      }
    }

    // よく使う駅・バス停タグの描画とワンタップ入力処理
    function renderQuickStations() {
      const container = document.getElementById('quick-stations');
      container.innerHTML = '';
      FAVORITE_PLACES.forEach(place => {
        const span = document.createElement('span');
        span.className = 'chip';
        span.textContent = place.label;
        span.onclick = () => insertPlaceTag(place.value);
        container.appendChild(span);
      });
    }

    // タグをタップした際、文脈に合わせて「〇〇から」「〇〇まで」を自動補完する
    function insertPlaceTag(placeName) {
      const textarea = document.getElementById('prompt');
      const current = textarea.value.trim();

      if (!current) {
        // 空欄のときは出発地として「〇〇から」を入力
        textarea.value = `${placeName}から`;
      } else if (current.endsWith('から')) {
        // 「〇〇から」で終わっているときは目的地として「△△まで」をつなげる
        textarea.value = `${current}${placeName}まで `;
      } else if (!current.includes('から')) {
        // 時刻だけ先に書いている場合（例：「明日9時着」）は「〇〇から」を追記
        textarea.value = `${current} ${placeName}から`;
      } else {
        // それ以外は末尾に追記
        textarea.value = `${current} ${placeName}`;
      }
      textarea.focus();
    }

    function clearPrompt() {
      const textarea = document.getElementById('prompt');
      textarea.value = '';
      textarea.focus();
      hideError();
    }

    // ==========================================
    // 2.5 音声入力（Web Speech API）と検索履歴
    // ==========================================
    let recognition = null;
    let isListening = false;

    function toggleVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('お使いのブラウザは音声入力に対応していません（ChromeやEdge、Safariでお試しください）。');
        return;
      }

      const btn = document.getElementById('btn-voice');

      if (isListening && recognition) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        btn.classList.add('listening');
        btn.textContent = '🛑 聴き取り中...';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const textarea = document.getElementById('prompt');
        textarea.value = textarea.value ? `${textarea.value} ${transcript}` : transcript;
      };

      recognition.onerror = (event) => {
        console.warn('Speech recognition error:', event.error);
      };

      recognition.onend = () => {
        isListening = false;
        btn.classList.remove('listening');
        btn.textContent = '🎤 音声入力';
      };

      recognition.start();
    }

    // 検索履歴の保存と表示（最大5件）
    function saveHistory(queryText) {
      let list = JSON.parse(localStorage.getItem('transit_history') || '[]');
      list = list.filter(item => item !== queryText);
      list.unshift(queryText);
      if (list.length > 5) list = list.slice(0, 5);
      localStorage.setItem('transit_history', JSON.stringify(list));
      renderHistory();
    }

    function deleteHistoryItem(index, event) {
      event.stopPropagation();
      let list = JSON.parse(localStorage.getItem('transit_history') || '[]');
      list.splice(index, 1);
      localStorage.setItem('transit_history', JSON.stringify(list));
      renderHistory();
    }

    function renderHistory() {
      const list = JSON.parse(localStorage.getItem('transit_history') || '[]');
      const section = document.getElementById('history-section');
      const container = document.getElementById('history-list');

      if (list.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      container.innerHTML = '';
      list.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'history-item';
        row.onclick = () => {
          document.getElementById('prompt').value = item;
        };

        const textSpan = document.createElement('span');
        textSpan.className = 'history-text';
        textSpan.textContent = item;

        const delSpan = document.createElement('span');
        delSpan.className = 'history-del';
        delSpan.textContent = '✕';
        delSpan.title = '履歴から削除';
        delSpan.onclick = (e) => deleteHistoryItem(idx, e);

        row.appendChild(textSpan);
        row.appendChild(delSpan);
        container.appendChild(row);
      });
    }

    // ==========================================
    // 3. Gemini API による自然文の経路解析
    // ==========================================
    let transitData = null;

    // 高速・安定している優先モデル（まずは一覧取得通信を省いて直接呼び出す）
    const PREFERRED_MODELS = [
      'gemini-2.5-flash',
      'gemini-2.0-flash',
      'gemini-1.5-flash'
    ];

    // 万が一、優先モデルがすべて使えない場合のみAPIから利用可能モデル一覧を取得する
    async function fetchFallbackModels(apiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (res.ok) {
          const data = await res.json();
          const list = (data.models || [])
            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
            .map(m => m.name.replace(/^models\//, ''))
            .filter(name => !PREFERRED_MODELS.includes(name));
          
          return list.sort((a, b) => {
            if (a.includes('flash') && !b.includes('flash')) return -1;
            if (!a.includes('flash') && b.includes('flash')) return 1;
            return 0;
          });
        }
      } catch (e) {
        console.warn('ListModels failed:', e);
      }
      return [];
    }

    // 指定したモデルで解析リクエストを送信する関数
    async function callGeminiModel(model, apiKey, fullPrompt) {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ 
            parts: [{ text: fullPrompt }] 
          }],
          // JSON出力モードを指定し、確実にJSON形式で応答させる
          generationConfig: {
            responseMimeType: "application/json"
          }
        })
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => null);
        const errMsg = errData?.error?.message || `HTTP ${response.status}`;
        throw new Error(errMsg);
      }

      const data = await response.json();
      let jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!jsonText) {
        throw new Error('AIの応答が空でした');
      }

      // 念のためマークダウン記号が含まれていた場合も除去してパース
      jsonText = jsonText.replace(/```json/gi, '').replace(/```/g, '').trim();
      const match = jsonText.match(/\{[\s\S]*\}/);
      if (match) {
        jsonText = match[0];
      }

      return JSON.parse(jsonText);
    }

    async function analyzeTransit() {
      const prompt = document.getElementById('prompt').value.trim();
      const apiKey = localStorage.getItem('gemini_api_key');
      const homeArea = localStorage.getItem('home_area') || '北海道・札幌';
      
      hideError();

      if (!prompt) {
        alert('検索したい内容を入力してください。');
        return;
      }
      if (!apiKey) {
        alert('APIキーが設定されていません。');
        showScreen('api-screen');
        return;
      }

      document.getElementById('loading').style.display = 'block';

      // 現在日時と「曜日」を取得（「来週火曜」などの相対表現を正確に計算させるため）
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
      const currentDate = String(now.getDate()).padStart(2, '0');
      const currentHour = String(now.getHours()).padStart(2, '0');
      const currentMinute = String(now.getMinutes()).padStart(2, '0');
      const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][now.getDay()];

      const systemPrompt = `あなたは優秀な乗換案内アシスタントです。
ユーザーの自然文入力を解析し、出発地、目的地、指定日時、出発/到着種別を正確に判定してJSONのみを出力してください。

現在日時: ${currentYear}年${currentMonth}月${currentDate}日(${dayOfWeek}曜日) ${currentHour}時${currentMinute}分
ユーザーの拠点エリア: ${homeArea}

【重要：日時・発着種別の判定ルール】
1. 発着種別 (time_type) の判定:
   - 到着指定 ("arrival"): 「〜着」「〜到着」「〜までに」「〜着く」「〜に着きたい」「〜着希望」などの表現がある場合
   - 出発指定 ("departure"): 「〜発」「〜出発」「〜に出る」「〜から向かう」など、または発着の明示がない場合

2. 日時・時刻の補完ルール:
   - 「明日」「明後日」「来週◯曜日」などの相対表現は、現在日時(${currentYear}/${currentMonth}/${currentDate} ${dayOfWeek}曜日)を基準にして正確な年月日を計算してください。
   - 日付が指定されていない場合は、現在日付(${currentYear}年${currentMonth}月${currentDate}日)を設定してください。
   - 「14時」「14:30」「午後2時」「夕方5時」などの時刻表現は、24時間表記の数値文字列（year: "YYYY", month: "MM", day: "DD", hour: "HH", minute: "MM"）に変換してください（1桁は2桁0埋め）。
   - 分が省略されている場合（例:「14時発」「14時着」）は minute: "00" としてください。
   - 時刻自体が全く指定されていない場合は、現在日時の hour, minute を設定してください。

3. 同名駅・駅名・バス停名の補正ルール:
   - 「学園前」「白石」「府中」など全国に同名駅が存在する場合：
     - 出発地または目的地の片方が判明している場合は、その駅と同一または近接エリアの駅を優先してください。
     - 手がかりがない場合は拠点エリア（${homeArea}）の駅を最優先してください。
     - Yahoo!乗換案内で確実にヒットする正式な駅名表記（例: 学園前(北海道)、白石(北海道) など）にしてください。「学園前(札幌)」と入力された場合も「学園前(北海道)」に変換してください。
   - バス停名（例:「月寒西2条9丁目」「月寒中央通11丁目」「月寒中央通10丁目」など）が入力された場合は、勝手に駅名へ変えず、そのままのバス停名称を出力してください。
   - 「駅」「バス停」「JR」「札幌市営地下鉄」「（空港連絡バス）」などの不要な修飾・補足メモは削除してください。

【出力JSONフォーマット】
{
  "from": "出発地（駅名またはバス停名）",
  "to": "目的地（駅名またはバス停名）",
  "year": "YYYY",
  "month": "MM",
  "day": "DD",
  "hour": "HH",
  "minute": "MM",
  "time_type": "departure" または "arrival"
}`;

      const fullPrompt = `${systemPrompt}\n\nユーザー入力:\n${prompt}`;

      try {
        let success = false;
        let lastError = '';

        // Step 1: まずは優先モデルリストを順に試す（余計な一覧取得通信をカットして高速化）
        for (const model of PREFERRED_MODELS) {
          try {
            transitData = await callGeminiModel(model, apiKey, fullPrompt);
            success = true;
            break;
          } catch (err) {
            lastError = err.message || '通信エラー';
          }
        }

        // Step 2: 万が一優先モデルがすべて失敗した場合のみ、利用可能モデル一覧を取得して試す
        if (!success) {
          const fallbackModels = await fetchFallbackModels(apiKey);
          for (const model of fallbackModels) {
            try {
              transitData = await callGeminiModel(model, apiKey, fullPrompt);
              success = true;
              break;
            } catch (err) {
              lastError = err.message || '通信エラー';
            }
          }
        }

        if (!success) {
          document.getElementById('loading').style.display = 'none';
          showError(`⚠️ <strong>解析エラー:</strong><br>${lastError}`);
          return;
        }

        // 履歴に保存し、結果画面へ反映
        saveHistory(prompt);
        renderResultInfo();
        document.getElementById('loading').style.display = 'none';
        showScreen('result-screen');

      } catch (globalError) {
        document.getElementById('loading').style.display = 'none';
        showError(`⚠️ <strong>エラー:</strong><br>${globalError.message}`);
      }
    }

    // ==========================================
    // 3.5 結果画面の描画と微調整（入れ替え・時刻調整）
    // ==========================================
    function renderResultInfo() {
      if (!transitData) return;

      const y = String(transitData.year).padStart(4, '0');
      const m = String(transitData.month).padStart(2, '0');
      const d = String(transitData.day).padStart(2, '0');
      const hh = String(transitData.hour).padStart(2, '0');
      const mm = String(transitData.minute).padStart(2, '0');
      const type = transitData.time_type === 'arrival' ? 'arrival' : 'departure';

      document.getElementById('edit-from').value = transitData.from || '';
      document.getElementById('edit-to').value = transitData.to || '';
      document.getElementById('edit-date').value = `${y}-${m}-${d}`;
      document.getElementById('edit-time').value = `${hh}:${mm}`;
      document.getElementById('edit-type').value = type;

      updateTypeBadge(type);
    }

    function updateTypeBadge(type) {
      const badge = document.getElementById('result-type-badge');
      if (type === 'arrival') {
        badge.className = 'tag-badge tag-arr';
        badge.textContent = '到着指定';
      } else {
        badge.className = 'tag-badge tag-dep';
        badge.textContent = '出発指定';
      }
    }

    // 結果画面で手動変更された内容を transitData に即時同期する
    function syncFromEdit() {
      if (!transitData) transitData = {};

      transitData.from = document.getElementById('edit-from').value.trim();
      transitData.to = document.getElementById('edit-to').value.trim();

      const dateVal = document.getElementById('edit-date').value;
      if (dateVal && dateVal.includes('-')) {
        const [y, m, d] = dateVal.split('-');
        transitData.year = y;
        transitData.month = m;
        transitData.day = d;
      }

      const timeVal = document.getElementById('edit-time').value;
      if (timeVal && timeVal.includes(':')) {
        const [hh, mm] = timeVal.split(':');
        transitData.hour = hh;
        transitData.minute = mm;
      }

      const typeVal = document.getElementById('edit-type').value;
      transitData.time_type = typeVal;
      updateTypeBadge(typeVal);
    }

    // 出発地と到着地をワンタップで入れ替える（帰りのルート検索用）
    function swapRoute() {
      const fromInput = document.getElementById('edit-from');
      const toInput = document.getElementById('edit-to');
      const temp = fromInput.value;
      fromInput.value = toInput.value;
      toInput.value = temp;
      syncFromEdit();
    }

    // 時刻を -15分 / +15分 ずらす
    function adjustMinutes(deltaMinutes) {
      syncFromEdit();
      if (!transitData) return;

      const y = parseInt(transitData.year, 10);
      const m = parseInt(transitData.month, 10) - 1;
      const d = parseInt(transitData.day, 10);
      const hh = parseInt(transitData.hour, 10);
      const mm = parseInt(transitData.minute, 10);

      const dt = new Date(y, m, d, hh, mm);
      dt.setMinutes(dt.getMinutes() + deltaMinutes);

      transitData.year = String(dt.getFullYear());
      transitData.month = String(dt.getMonth() + 1).padStart(2, '0');
      transitData.day = String(dt.getDate()).padStart(2, '0');
      transitData.hour = String(dt.getHours()).padStart(2, '0');
      transitData.minute = String(dt.getMinutes()).padStart(2, '0');

      renderResultInfo();
    }

    // 日時を「現在時刻」にリセットする
    function setNowTime() {
      if (!transitData) return;
      const now = new Date();
      transitData.year = String(now.getFullYear());
      transitData.month = String(now.getMonth() + 1).padStart(2, '0');
      transitData.day = String(now.getDate()).padStart(2, '0');
      transitData.hour = String(now.getHours()).padStart(2, '0');
      transitData.minute = String(now.getMinutes()).padStart(2, '0');
      renderResultInfo();
    }

    // ==========================================
    // 4. 各乗換案内サービスへのURL生成・遷移（共通化）
    // ==========================================
    function getFormattedTransitParams() {
      syncFromEdit();
      if (!transitData) return null;
      const clean = (val) => String(val || '').trim().replace(/[\r\n\s]/g, '');
      const mStr = clean(transitData.minute).padStart(2, '0');

      return {
        rawFrom: clean(transitData.from),
        rawTo: clean(transitData.to),
        cFrom: encodeURIComponent(clean(transitData.from)),
        cTo: encodeURIComponent(clean(transitData.to)),
        cYear: clean(transitData.year),
        cMonth: clean(transitData.month).padStart(2, '0'),
        cDay: clean(transitData.day).padStart(2, '0'),
        cHour: clean(transitData.hour).padStart(2, '0'),
        m1: mStr.charAt(0) || '0',
        m2: mStr.charAt(1) || '0',
        isArrival: clean(transitData.time_type) === 'arrival'
      };
    }

    function openJorudan() {
      const p = getFormattedTransitParams();
      if (!p) return;
      
      // ジョルダン: Cway (0: 出発, 1: 到着), S=検索 で直接結果画面へ遷移
      const cway = p.isArrival ? '1' : '0';
      const url = `https://www.jorudan.co.jp/norikae/cgi/nori.cgi?eki1=${p.cFrom}&eki2=${p.cTo}&Dyy=${p.cYear}&Dmm=${p.cMonth}&Ddd=${p.cDay}&Dhh=${p.cHour}&Dmn1=${p.m1}&Dmn2=${p.m2}&Cway=${cway}&S=%E6%A4%9C%E7%B4%A2`;
      window.open(url, '_blank');
    }

    function openYahoo() {
      const p = getFormattedTransitParams();
      if (!p) return;
      
      // Yahoo!乗換案内: type (1: 出発, 4: 到着)
      const typeParam = p.isArrival ? '4' : '1';
      const url = `https://transit.yahoo.co.jp/search/result?from=${p.cFrom}&to=${p.cTo}&y=${p.cYear}&m=${p.cMonth}&d=${p.cDay}&hh=${p.cHour}&m1=${p.m1}&m2=${p.m2}&type=${typeParam}`;
      window.open(url, '_blank');
    }

    function openGoogleMaps() {
      const p = getFormattedTransitParams();
      if (!p) return;
      
      const url = `https://www.google.com/maps/dir/?api=1&origin=${p.cFrom}&destination=${p.cTo}&travelmode=transit`;
      window.open(url, '_blank');
    }
  </script>
