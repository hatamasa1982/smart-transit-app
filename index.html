<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマート乗換コンシェルジュ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF8F5;
      --text-color: #2A2A2A;
      --primary-color: #F4A261;
      --primary-hover: #E76F51;
      --card-bg: #FFFFFF;
      --border-color: #E0DCD3;
      --yahoo-color: #FF0033;
      --google-color: #4285F4;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 5px;
      color: var(--text-color);
    }
    
    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
      background-color: #FAFAFA;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #FFF;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s, transform 0.1s;
      box-sizing: border-box;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-yahoo {
      background-color: white;
      color: var(--yahoo-color);
      border: 2px solid var(--yahoo-color);
      margin-bottom: 10px;
    }

    .btn-google {
      background-color: white;
      color: var(--google-color);
      border: 2px solid var(--google-color);
    }

    #main-screen, #api-screen, #result-screen {
      display: none;
    }

    .active {
      display: block !important;
    }

    .settings-link {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: 20px;
      text-decoration: underline;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      display: none;
      margin: 20px 0;
      color: var(--primary-color);
      font-weight: 500;
    }
    
    .spinner {
      border: 3px solid rgba(244, 162, 97, 0.3);
      border-radius: 50%;
      border-top: 3px solid var(--primary-color);
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-info {
      background-color: #F5F5F5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    
    .result-info span {
      font-weight: bold;
      color: var(--primary-color);
    }

    .tag-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-left: 6px;
    }
    .tag-dep {
      background-color: #E0F2FE;
      color: #0369A1;
    }
    .tag-arr {
      background-color: #FEF3C7;
      color: #B45309;
    }
    
    .btn-back {
      background-color: #EEE;
      color: #555;
      margin-top: 20px;
    }

    .error-box {
      display: none;
      background-color: #FEE2E2;
      color: #991B1B;
      border: 1px solid #F87171;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 15px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>スマート乗換コンシェルジュ</h1>
      <div class="subtitle">自然な言葉で、サッと経路検索。</div>

      <!-- APIキー設定画面 -->
      <div id="api-screen">
        <div class="form-group">
          <label for="api-key">Gemini API キー</label>
          <input type="password" id="api-key" placeholder="AIの利用に必要なキーを入力">
          <p style="font-size: 0.8rem; color: #777; margin-top: 8px;">
            ※キーはブラウザにのみ保存され、外部サーバーには送信されません。
          </p>
        </div>
        <button class="btn btn-primary" onclick="saveApiKey()">保存して使う</button>
      </div>

      <!-- メイン画面（入力） -->
      <div id="main-screen">
        <div class="form-group">
          <label for="prompt">どこへ行きますか？</label>
          <textarea id="prompt" placeholder="例：9月8日 15:00 浅草橋駅着 出発は下北沢"></textarea>
        </div>
        <button class="btn btn-primary" onclick="analyzeTransit()">経路を検索する</button>
        
        <div id="loading" class="loading">
          <div class="spinner"></div>
          AIが日時と場所を解析中...
        </div>

        <div id="error-box" class="error-box"></div>

        <a class="settings-link" onclick="showScreen('api-screen')">APIキーを再設定する</a>
      </div>

      <!-- 結果画面 -->
      <div id="result-screen">
        <div class="result-info" id="result-info"></div>
        
        <button class="btn btn-yahoo" id="btn-yahoo" onclick="openYahoo()">🚃 Yahoo!乗換案内で見る</button>
        <button class="btn btn-google" id="btn-google" onclick="openGoogleMaps()">🗺️ Googleマップで見る</button>
        
        <button class="btn btn-back" onclick="showScreen('main-screen')">戻る</button>
      </div>

    </div>
  </div>

  <script>
    function showScreen(screenId) {
      document.getElementById('api-screen').classList.remove('active');
      document.getElementById('main-screen').classList.remove('active');
      document.getElementById('result-screen').classList.remove('active');
      document.getElementById(screenId).classList.add('active');
      hideError();
    }

    function showError(msg) {
      const err = document.getElementById('error-box');
      err.style.display = 'block';
      err.innerHTML = msg;
    }

    function hideError() {
      const err = document.getElementById('error-box');
      err.style.display = 'none';
      err.innerHTML = '';
    }

    window.onload = () => {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (apiKey) {
        document.getElementById('api-key').value = apiKey;
        showScreen('main-screen');
      } else {
        showScreen('api-screen');
      }
    };

    function saveApiKey() {
      const key = document.getElementById('api-key').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        showScreen('main-screen');
      } else {
        alert('APIキーを入力してください。');
      }
    }

    let transitData = null;

    // 確実に動作するモデル一覧を取得する
    async function getUsableModels(apiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (res.ok) {
          const data = await res.json();
          const list = (data.models || [])
            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
            .map(m => m.name.replace(/^models\//, ''));
          
          if (list.length > 0) {
            // flashモデルを最優先にする
            return list.sort((a, b) => {
              if (a.includes('flash') && !b.includes('flash')) return -1;
              if (!a.includes('flash') && b.includes('flash')) return 1;
              return 0;
            });
          }
        }
      } catch (e) {
        console.warn('ListModels failed:', e);
      }
      return ['gemini-1.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash-latest', 'gemini-1.5-pro'];
    }

    async function analyzeTransit() {
      const prompt = document.getElementById('prompt').value.trim();
      const apiKey = localStorage.getItem('gemini_api_key');
      
      hideError();

      if (!prompt) {
        alert('検索したい内容を入力してください。');
        return;
      }
      if (!apiKey) {
        alert('APIキーが設定されていません。');
        showScreen('api-screen');
        return;
      }

      document.getElementById('loading').style.display = 'block';

      const now = new Date();
      const systemPrompt = `あなたは優秀な乗換案内アシスタントです。
ユーザーの自然文入力を解析し、出発地、目的地、指定日時、およびそれが「出発時刻」なのか「到着時刻」なのかを判定してJSONのみを出力してください。

現在日時: ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${now.getHours()}時${now.getMinutes()}分

【出力JSONフォーマット】
{
  "from": "出発地（駅名または地名）",
  "to": "目的地（駅名または地名）",
  "year": "YYYY",
  "month": "MM",
  "day": "DD",
  "hour": "HH",
  "minute": "MM",
  "time_type": "departure" または "arrival"
}

【判定ルール】
- 「〜着」「〜到着」「〜までに」「〜着く」とあれば time_type は "arrival"
- 「〜発」「〜出発」「〜出る」または特に指定がなければ time_type は "departure"
- 「駅」や路線名が混ざっている場合は、Yahoo!乗換案内で確実にヒットする純粋な駅名・地名（例: 月寒中央、浅草橋、下北沢）に補正してください。
- 出力はJSON形式のみとし、マークダウン記法や説明文は一切含めないでください。`;

      try {
        const models = await getUsableModels(apiKey);
        let success = false;
        let lastError = '';

        for (const model of models) {
          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ 
                  parts: [
                    { text: systemPrompt + "\n\nユーザー入力:\n" + prompt }
                  ] 
                }]
              })
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => null);
              const errMsg = errData?.error?.message || `HTTP ${response.status}`;
              lastError = errMsg;
              continue;
            }

            const data = await response.json();
            let jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!jsonText) {
              throw new Error('AIの応答が空でした');
            }

            jsonText = jsonText.replace(/```json/gi, '').replace(/```/g, '').trim();
            const match = jsonText.match(/\{[\s\S]*\}/);
            if (match) {
              jsonText = match[0];
            }

            transitData = JSON.parse(jsonText);

            const isArrival = transitData.time_type === 'arrival';
            const typeBadge = isArrival 
              ? '<span class="tag-badge tag-arr">到着指定</span>' 
              : '<span class="tag-badge tag-dep">出発指定</span>';

            const infoDiv = document.getElementById('result-info');
            infoDiv.innerHTML = `
              出発： <span>${transitData.from || '指定なし'}</span><br>
              到着： <span>${transitData.to || '指定なし'}</span><br>
              日時： <span>${transitData.year}年${String(transitData.month).padStart(2, '0')}月${String(transitData.day).padStart(2, '0')}日 ${String(transitData.hour).padStart(2, '0')}:${String(transitData.minute).padStart(2, '0')}</span> ${typeBadge}
            `;
            
            document.getElementById('loading').style.display = 'none';
            showScreen('result-screen');
            success = true;
            break;

          } catch (err) {
            lastError = err.message || '通信エラー';
          }
        }

        if (!success) {
          document.getElementById('loading').style.display = 'none';
          showError(`⚠️ <strong>解析エラー:</strong><br>${lastError}`);
        }

      } catch (globalError) {
        document.getElementById('loading').style.display = 'none';
        showError(`⚠️ <strong>エラー:</strong><br>${globalError.message}`);
      }
    }

    function openYahoo() {
      if (!transitData) return;
      
      const { from, to, year, month, day, hour, minute, time_type } = transitData;
      const mStr = String(minute || '00').padStart(2, '0');
      const m1 = mStr.charAt(0);
      const m2 = mStr.charAt(1);
      
      const typeParam = (time_type === 'arrival') ? '4' : '1';
      const url = `https://transit.yahoo.co.jp/search/result?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&y=${year}&m=${String(month).padStart(2, '0')}&d=${String(day).padStart(2, '0')}&hh=${String(hour).padStart(2, '0')}&m1=${m1}&m2=${m2}&type=${typeParam}`;
      
      window.open(url, '_blank');
    }

    function openGoogleMaps() {
      if (!transitData) return;
      
      const { from, to } = transitData;
      const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}&travelmode=transit`;
      
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
