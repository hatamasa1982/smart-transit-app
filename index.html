<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマート乗換コンシェルジュ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF8F5;
      --text-color: #2A2A2A;
      --primary-color: #F4A261;
      --primary-hover: #E76F51;
      --card-bg: #FFFFFF;
      --border-color: #E0DCD3;
      --yahoo-color: #FF0033;
      --google-color: #4285F4;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 5px;
      color: var(--text-color);
    }
    
    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
      background-color: #FAFAFA;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #FFF;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s, transform 0.1s;
      box-sizing: border-box;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-yahoo {
      background-color: white;
      color: var(--yahoo-color);
      border: 2px solid var(--yahoo-color);
      margin-bottom: 10px;
    }

    .btn-google {
      background-color: white;
      color: var(--google-color);
      border: 2px solid var(--google-color);
    }

    #main-screen, #api-screen, #result-screen {
      display: none;
    }

    .active {
      display: block !important;
    }

    .settings-link {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: 20px;
      text-decoration: underline;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      display: none;
      margin: 20px 0;
      color: var(--primary-color);
      font-weight: 500;
    }
    
    .spinner {
      border: 3px solid rgba(244, 162, 97, 0.3);
      border-radius: 50%;
      border-top: 3px solid var(--primary-color);
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-info {
      background-color: #F5F5F5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    
    .result-info span {
      font-weight: bold;
      color: var(--primary-color);
    }

    .tag-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-left: 6px;
    }
    .tag-dep {
      background-color: #E0F2FE;
      color: #0369A1;
    }
    .tag-arr {
      background-color: #FEF3C7;
      color: #B45309;
    }
    
    .btn-back {
      background-color: #EEE;
      color: #555;
      margin-top: 20px;
    }

    .error-box {
      display: none;
      background-color: #FEE2E2;
      color: #991B1B;
      border: 1px solid #F87171;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 15px;
      word-break: break-all;
    }

    .area-badge {
      font-size: 0.75rem;
      color: #666;
      background: #EAE6DF;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>スマート乗換コンシェルジュ</h1>
      <div class="subtitle">自然な言葉で、サッと経路検索。</div>

      <!-- 設定画面 -->
      <div id="api-screen">
        <div class="form-group">
          <label for="api-key">Gemini API キー</label>
          <input type="password" id="api-key" placeholder="AIの利用に必要なキーを入力">
        </div>

        <div class="form-group">
          <label for="home-area">よく使うホームエリア（同名駅の優先地域）</label>
          <input type="text" id="home-area" value="北海道・札幌" placeholder="例：北海道・札幌、東京都内など">
          <p style="font-size: 0.8rem; color: #777; margin-top: 6px;">
            ※「学園前」「白石」などの全国同名駅がある場合、このエリアの駅が最優先されます。
          </p>
        </div>

        <button class="btn btn-primary" onclick="saveSettings()">設定を保存して使う</button>
      </div>

      <!-- メイン画面（入力） -->
      <div id="main-screen">
        <div class="form-group">
          <label for="prompt">
            どこへ行きますか？
            <span id="current-home-badge" class="area-badge"></span>
          </label>
          <textarea id="prompt" placeholder="例：月寒中央から学園前まで"></textarea>
        </div>
        <button class="btn btn-primary" onclick="analyzeTransit()">経路を検索する</button>
        
        <div id="loading" class="loading">
          <div class="spinner"></div>
          AIが日時と場所を解析中...
        </div>

        <div id="error-box" class="error-box"></div>

        <a class="settings-link" onclick="showScreen('api-screen')">設定（APIキー・ホームエリア）を変更</a>
      </div>

      <!-- 結果画面 -->
      <div id="result-screen">
        <div class="result-info" id="result-info"></div>
        
        <button class="btn btn-yahoo" id="btn-yahoo" onclick="openYahoo()">🚃 Yahoo!乗換案内で見る</button>
        <button class="btn btn-google" id="btn-google" onclick="openGoogleMaps()">🗺️ Googleマップで見る</button>
        
        <button class="btn btn-back" onclick="showScreen('main-screen')">戻る</button>
      </div>

    </div>
  </div>

  <script>
    function showScreen(screenId) {
      document.getElementById('api-screen').classList.remove('active');
      document.getElementById('main-screen').classList.remove('active');
      document.getElementById('result-screen').classList.remove('active');
      document.getElementById(screenId).classList.add('active');
      hideError();
    }

    function showError(msg) {
      const err = document.getElementById('error-box');
      err.style.display = 'block';
      err.innerHTML = msg;
    }

    function hideError() {
      const err = document.getElementById('error-box');
      err.style.display = 'none';
      err.innerHTML = '';
    }

    function updateBadge() {
      const homeArea = localStorage.getItem('home_area') || '北海道・札幌';
      const badge = document.getElementById('current-home-badge');
      if (badge) {
        badge.innerText = `拠点: ${homeArea}`;
      }
    }

    window.onload = () => {
      const apiKey = localStorage.getItem('gemini_api_key');
      const homeArea = localStorage.getItem('home_area') || '北海道・札幌';
      document.getElementById('home-area').value = homeArea;

      if (apiKey) {
        document.getElementById('api-key').value = apiKey;
        updateBadge();
        showScreen('main-screen');
      } else {
        showScreen('api-screen');
      }
    };

    function saveSettings() {
      const key = document.getElementById('api-key').value.trim();
      const area = document.getElementById('home-area').value.trim() || '北海道・札幌';
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        localStorage.setItem('home_area', area);
        updateBadge();
        showScreen('main-screen');
      } else {
        alert('APIキーを入力してください。');
      }
    }

    let transitData = null;

    async function getUsableModels(apiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (res.ok) {
          const data = await res.json();
          const list = (data.models || [])
            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
            .map(m => m.name.replace(/^models\//, ''));
          
          if (list.length > 0) {
            return list.sort((a, b) => {
              if (a.includes('flash') && !b.includes('flash')) return -1;
              if (!a.includes('flash') && b.includes('flash')) return 1;
              return 0;
            });
          }
        }
      } catch (e) {
        console.warn('ListModels failed:', e);
      }
      return ['gemini-1.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash-latest', 'gemini-1.5-pro'];
    }

    async function analyzeTransit() {
      const prompt = document.getElementById('prompt').value.trim();
      const apiKey = localStorage.getItem('gemini_api_key');
      const homeArea = localStorage.getItem('home_area') || '北海道・札幌';
      
      hideError();

      if (!prompt) {
        alert('検索したい内容を入力してください。');
        return;
      }
      if (!apiKey) {
        alert('APIキーが設定されていません。');
        showScreen('api-screen');
        return;
      }

      document.getElementById('loading').style.display = 'block';

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
      const currentDate = String(now.getDate()).padStart(2, '0');
      const currentHour = String(now.getHours()).padStart(2, '0');
      const currentMinute = String(now.getMinutes()).padStart(2, '0');

      const systemPrompt = `あなたは優秀な乗換案内アシスタントです。
ユーザーの自然文入力を解析し、出発地、目的地、指定日時、出発/到着種別を正確に判定してJSONのみを出力してください。

現在日時: ${currentYear}年${currentMonth}月${currentDate}日 ${currentHour}時${currentMinute}分
ユーザーの拠点エリア: ${homeArea}

【重要：日時・発着種別の判定ルール】
1. 発着種別 (time_type) の判定:
   - 到着指定 ("arrival"): 「〜着」「〜到着」「〜までに」「〜着く」「〜に着きたい」「〜着希望」などの表現がある場合
   - 出発指定 ("departure"): 「〜発」「〜出発」「〜に出る」「〜から向かう」など、または発着の明示がない場合

2. 日時・時刻の補完ルール:
   - 「明日」「明後日」「来週◯曜日」などの相対表現は、現在日時(${currentYear}/${currentMonth}/${currentDate})を基準にして正確な年月日を計算してください。
   - 日付が指定されていない場合は、現在日付(${currentYear}年${currentMonth}月${currentDate}日)を設定してください。
   - 「14時」「14:30」「午後2時」「夕方5時」などの時刻表現は、24時間表記の数値文字列（year: "YYYY", month: "MM", day: "DD", hour: "HH", minute: "MM"）に変換してください（1桁は2桁0埋め）。
   - 分が省略されている場合（例:「14時発」「14時着」）は minute: "00" としてください。
   - 時刻自体が全く指定されていない場合は、現在日時の hour, minute を設定してください。

3. 同名駅・駅名の補正ルール:
   - 「学園前」「白石」「府中」など全国に同名駅が存在する場合：
     - 出発地または目的地の片方が判明している場合は、その駅と同一または近接エリアの駅を優先してください。
     - 手がかりがない場合は拠点エリア（${homeArea}）の駅を最優先してください。
     - Yahoo!乗換案内で確実にヒットする正式な駅名表記（例: 学園前(北海道)、白石(北海道) など）にしてください。
   - 「駅」「JR」「札幌市営地下鉄」などの不要な修飾は削除してください。

【出力JSONフォーマット】
{
  "from": "出発地（駅名）",
  "to": "目的地（駅名）",
  "year": "YYYY",
  "month": "MM",
  "day": "DD",
  "hour": "HH",
  "minute": "MM",
  "time_type": "departure" または "arrival"
}

【入力例と解析結果】
- 「明日の朝9時着で札幌から新千歳空港」
  -> {"from":"札幌","to":"新千歳空港","year":"${currentYear}","month":"...","day":"...","hour":"09","minute":"00","time_type":"arrival"}
- 「17:30発 月寒中央から大通」
  -> {"from":"月寒中央","to":"大通","year":"${currentYear}","month":"${currentMonth}","day":"${currentDate}","hour":"17","minute":"30","time_type":"departure"}

出力は純粋なJSON文字列のみとし、マークダウン記法は含めないでください。`;

      try {
        const models = await getUsableModels(apiKey);
        let success = false;
        let lastError = '';

        for (const model of models) {
          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ 
                  parts: [
                    { text: systemPrompt + "\n\nユーザー入力:\n" + prompt }
                  ] 
                }]
              })
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => null);
              const errMsg = errData?.error?.message || `HTTP ${response.status}`;
              lastError = errMsg;
              continue;
            }

            const data = await response.json();
            let jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!jsonText) {
              throw new Error('AIの応答が空でした');
            }

            jsonText = jsonText.replace(/```json/gi, '').replace(/```/g, '').trim();
            const match = jsonText.match(/\{[\s\S]*\}/);
            if (match) {
              jsonText = match[0];
            }

            transitData = JSON.parse(jsonText);

            const isArrival = transitData.time_type === 'arrival';
            const typeBadge = isArrival 
              ? '<span class="tag-badge tag-arr">到着指定</span>' 
              : '<span class="tag-badge tag-dep">出発指定</span>';

            const infoDiv = document.getElementById('result-info');
            infoDiv.innerHTML = `
              出発： <span>${transitData.from || '指定なし'}</span><br>
              到着： <span>${transitData.to || '指定なし'}</span><br>
              日時： <span>${transitData.year}年${String(transitData.month).padStart(2, '0')}月${String(transitData.day).padStart(2, '0')}日 ${String(transitData.hour).padStart(2, '0')}:${String(transitData.minute).padStart(2, '0')}</span> ${typeBadge}
            `;
            
            document.getElementById('loading').style.display = 'none';
            showScreen('result-screen');
            success = true;
            break;

          } catch (err) {
            lastError = err.message || '通信エラー';
          }
        }

        if (!success) {
          document.getElementById('loading').style.display = 'none';
          showError(`⚠️ <strong>解析エラー:</strong><br>${lastError}`);
        }

      } catch (globalError) {
        document.getElementById('loading').style.display = 'none';
        showError(`⚠️ <strong>エラー:</strong><br>${globalError.message}`);
      }
    }

    function openYahoo() {
      if (!transitData) return;
      
      const { from, to, year, month, day, hour, minute, time_type } = transitData;
      const mStr = String(minute || '00').padStart(2, '0');
      const m1 = mStr.charAt(0);
      const m2 = mStr.charAt(1);
      
      // Yahoo乗換案内の仕様上、外部からURLで「指定席優先(expkind)」や「交通手段(exなど)」を指定すると、
      // 内部の経路探索アルゴリズムが不整合を起こし、全車指定席特急が除外されるなどの深刻なバグを引き起こすことが判明しました。
      // したがって、検索オプションは一切付与せず、Yahooの標準デフォルトエンジンにすべて任せるのが最も確実です。
      const url = `https://transit.yahoo.co.jp/search/result?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&y=${year}&m=${String(month).padStart(2, '0')}&d=${String(day).padStart(2, '0')}&h=${String(hour).padStart(2, '0')}&m1=${m1}&m2=${m2}&type=${typeParam}`;
      
      window.open(url, '_blank');
    }

    function openGoogleMaps() {
      if (!transitData) return;
      
      const { from, to } = transitData;
      const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}&travelmode=transit`;
      
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
